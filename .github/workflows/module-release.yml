name: module-release
# Manual. Builds the loadable netplay module per platform, merges the
# fragments into netplay-module-manifest.json and, with `publish`, attaches
# everything to the GitHub release for `tag` (docs/module.md). UNTESTED in CI as
# of its writing: scripts/package-module.sh is what was run by hand.
on:
  workflow_dispatch:
    inputs:
      tag: { description: "release tag (vX.Y.Z)", required: true }
      publish: { description: "attach to the release", type: boolean, default: false }
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: RetroPortingToolKit/retcomm-rbengine, path: rbengine }
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
        if: startsWith(matrix.os, 'ubuntu')
      - run: brew install ninja
        if: startsWith(matrix.os, 'macos')
      - run: scripts/package-module.sh "$PWD/rbengine" out
      - uses: actions/upload-artifact@v4
        with: { name: "module-${{ matrix.os }}", path: out }
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dl, merge-multiple: true }
      - run: |
          python3 scripts/merge-module-manifest.py \
            "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}" \
            dl/netplay-module-manifest.json dl/*.manifest.json
          (cd dl && sha256sum *.tar.gz > SHA256SUMS)
      - if: inputs.publish
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ inputs.tag }}" dl/*.tar.gz dl/SHA256SUMS dl/netplay-module-manifest.json --clobber
